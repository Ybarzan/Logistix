name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (tsc + eslint)
        run: npm run lint
      - name: Tests backend (convex-test)
        run: npm test
      - name: Build (client + SSR)
        run: npm run build
